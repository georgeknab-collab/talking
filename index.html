<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Hub — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'DM Sans',sans-serif; background:#0b0b0f; color:white; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ── MODAL ── */
.modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(12px); z-index:9999; justify-content:center; align-items:center; padding:20px; }
.modal.show{ display:flex; }
.modal-box{ background:#111118; border:1px solid rgba(255,49,49,0.3); border-radius:20px; box-shadow:0 0 60px rgba(255,49,49,0.15); animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); overflow:hidden; width:100%; max-width:400px; text-align:center; }
@keyframes popIn{ from{ transform:scale(0.88); opacity:0; } to{ transform:scale(1); opacity:1; } }

.gate-icon{ font-size:52px; margin:30px 0 16px; }
.modal-box h2{ font-family:'Archivo Black',sans-serif; font-size:24px; letter-spacing:2px; margin-bottom:8px; }
.modal-box p{ color:#555; font-size:13px; margin-bottom:28px; }
.modal-box input{ width:calc(100% - 56px); margin:0 28px 16px; padding:14px 18px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:#1a1a24; color:white; font-size:16px; text-align:center; outline:none; font-family:'DM Sans',sans-serif; transition:border 0.2s; }
.modal-box input:focus{ border-color:rgba(255,49,49,0.5); }
.modal-box input.error{ border-color:#ff3131; animation:shake 0.4s; }
.gate-btn{ width:calc(100% - 56px); margin:0 28px 28px; padding:14px; border:none; border-radius:12px; background:#ff3131; color:white; font-size:15px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; transition:0.2s; box-shadow:0 0 20px rgba(255,49,49,0.3); letter-spacing:1px; }
.gate-btn:hover{ background:#ff5555; transform:translateY(-1px); }

/* ── NAVBAR ── */
nav{ width:100%; height:70px; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:flex; justify-content:space-between; align-items:center; padding:0 30px; border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0; }
.logo{ font-family:'Archivo Black',sans-serif; font-size:22px; color:#ff3131; text-shadow:0 0 16px #ff3131; letter-spacing:3px; text-decoration:none; }
.nav-links{ display:flex; gap:24px; align-items:center; }
.nav-links a{ color:#777; text-decoration:none; font-size:14px; font-weight:500; transition:0.2s; }
.nav-links a:hover, .nav-links a.active{ color:white; }
.online-pill{ display:flex; align-items:center; gap:6px; background:#16161d; border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:6px 14px; font-size:12px; color:#555; }
.online-dot{ width:7px; height:7px; border-radius:50%; background:#10b981; animation:pulse 2s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

/* ── CHAT LAYOUT ── */
.chat-wrap{ flex:1; display:flex; overflow:hidden; }

/* Sidebar */
.sidebar{ width:240px; border-right:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-header{ padding:18px 20px 14px; border-bottom:1px solid rgba(255,255,255,0.06); }
.sidebar-header h3{ font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:2px; color:#555; margin-bottom:12px; }
.online-list{ flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
.online-list::-webkit-scrollbar{ width:4px; }
.online-list::-webkit-scrollbar-thumb{ background:#222; border-radius:2px; }
.online-user{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; transition:0.2s; }
.online-user:hover{ background:#16161d; }
.ou-avatar{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
.ou-name{ font-size:13px; font-weight:500; }
.ou-you{ font-size:10px; color:#555; margin-left:4px; }

/* Main chat */
.chat-main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }

.chat-header{ padding:16px 24px; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:12px; flex-shrink:0; }
.chat-header .ch-icon{ font-size:20px; }
.chat-header h2{ font-family:'Archivo Black',sans-serif; font-size:18px; letter-spacing:1px; }
.chat-header .ch-sub{ font-size:12px; color:#555; margin-top:1px; }
.clear-btn{ margin-left:auto; background:none; border:1px solid rgba(255,49,49,0.3); color:#ff3131; border-radius:8px; padding:6px 14px; font-size:12px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:0.2s; display:none; }
.clear-btn:hover{ background:#ff3131; color:white; }
body.admin-mode .clear-btn{ display:block; }

.messages{ flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
.messages::-webkit-scrollbar{ width:6px; }
.messages::-webkit-scrollbar-thumb{ background:#1a1a24; border-radius:3px; }

/* Message bubbles */
.msg{ display:flex; gap:10px; max-width:75%; animation:fadeUp 0.2s ease; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.msg.mine{ align-self:flex-end; flex-direction:row-reverse; }
.msg-avatar{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; margin-top:2px; }
.msg-content{ display:flex; flex-direction:column; gap:4px; }
.msg.mine .msg-content{ align-items:flex-end; }
.msg-meta{ font-size:11px; color:#444; display:flex; gap:6px; align-items:center; }
.msg-name{ font-weight:600; color:#666; }
.msg-bubble{ padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; word-break:break-word; }
.msg:not(.mine) .msg-bubble{ background:#16161d; border:1px solid rgba(255,255,255,0.05); border-top-left-radius:4px; }
.msg.mine .msg-bubble{ background:#ff3131; color:white; border-top-right-radius:4px; }
.msg-time{ font-size:10px; color:#333; }
.msg.mine .msg-time{ color:rgba(255,255,255,0.4); }

/* System messages */
.sys-msg{ text-align:center; font-size:12px; color:#333; padding:4px 0; }

/* Date divider */
.date-divider{ display:flex; align-items:center; gap:12px; margin:8px 0; }
.date-divider span{ font-size:11px; color:#333; white-space:nowrap; }
.date-divider::before, .date-divider::after{ content:""; flex:1; height:1px; background:rgba(255,255,255,0.05); }

/* Typing indicator */
.typing-indicator{ font-size:12px; color:#444; padding:0 24px 8px; min-height:24px; }

/* Input */
.input-bar{ padding:14px 24px; border-top:1px solid rgba(255,255,255,0.06); display:flex; gap:10px; align-items:flex-end; background:#0b0b0f; flex-shrink:0; }
.input-bar textarea{ flex:1; background:#16161d; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px 16px; color:white; font-size:14px; font-family:'DM Sans',sans-serif; outline:none; resize:none; height:46px; max-height:120px; line-height:1.5; transition:border 0.2s; overflow-y:auto; }
.input-bar textarea:focus{ border-color:rgba(255,49,49,0.4); }
.input-bar textarea::placeholder{ color:#333; }
.send-btn{ width:46px; height:46px; border-radius:12px; background:#ff3131; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:0.2s; box-shadow:0 0 16px rgba(255,49,49,0.3); }
.send-btn:hover{ background:#ff5555; transform:scale(1.05); }
.send-btn svg{ width:18px; height:18px; fill:white; }
.send-btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }

/* Empty state */
.empty-chat{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#333; gap:10px; }
.empty-chat .ec-icon{ font-size:48px; }
.empty-chat p{ font-size:14px; }

@keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); } }
</style>
</head>
<body>

<!-- NAME GATE -->
<div class="modal show" id="nameGate">
  <div class="modal-box">
    <div class="gate-icon">💬</div>
    <h2>JOIN THE CHAT</h2>
    <p>Enter your name to start chatting</p>
    <input type="text" id="nameInput" placeholder="Your name…" maxlength="30" autocomplete="off">
    <button class="gate-btn" onclick="joinChat()">JOIN</button>
  </div>
</div>

<!-- NAVBAR -->
  </div>
  <div class="online-pill">
    <div class="online-dot"></div>
    <span id="onlineCount">0 online</span>
  </div>
</nav>

<!-- CHAT -->
<div class="chat-wrap">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>ONLINE NOW</h3>
    </div>
    <div class="online-list" id="onlineList"></div>
  </aside>

  <!-- Main -->
  <main class="chat-main">
    <div class="chat-header">
      <div class="ch-icon">🎬</div>
      <div>
        <h2>MOVIE HUB CHAT</h2>
        <div class="ch-sub">Talk movies with everyone</div>
      </div>
      <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="messages" id="messages">
      <div class="empty-chat" id="emptyChat">
        <div class="ec-icon">🍿</div>
        <p>No messages yet — say something!</p>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator"></div>

    <div class="input-bar">
      <textarea id="msgInput" placeholder="Message the chat…" rows="1" onkeydown="handleKey(event)" oninput="handleTyping()"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </main>

</div>

<script>
// ── JSONBin config ────────────────────────────────────────────────────────
const MASTER_KEY = "$2a$10$EnLaOf3SjY6dKeq47M8uYeZK5N8f9xTYzPfbsR3fMNyiRZHY9Uqne";
const BASE       = "https://api.jsonbin.io/v3/b";

// Create a 4th bin for chat — paste your chat bin ID here after creating it
// Bin JSON: {"messages":[],"online":{}}
const BIN_CHAT = "6a260fc5f5f4af5e29c8873c";

const ADMIN_CODE = "7122715";

// Avatar colors pool
const COLORS = ["#ff3131","#f97316","#ffb400","#10b981","#3b82f6","#8b5cf6","#ec4899","#06b6d4"];
function colorFor(name){ let h=0; for(let c of name) h=(h+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }

let myName     = "";
let myColor    = "";
let myId       = "";
let messages   = [];
let lastMsgId  = "";
let pollTimer  = null;
let typingTimer= null;
let isAdmin    = sessionStorage.getItem("vaultAdmin")==="true";

if(isAdmin) document.body.classList.add("admin-mode");

// ── JSONBin ───────────────────────────────────────────────────────────────
async function binGet(binId){
  const r = await fetch(`${BASE}/${binId}/latest`,{ headers:{"X-Master-Key":MASTER_KEY} });
  if(!r.ok) throw new Error("GET "+r.status);
  return (await r.json()).record;
}
async function binPut(binId, data){
  const r = await fetch(`${BASE}/${binId}`,{ method:"PUT", headers:{"Content-Type":"application/json","X-Master-Key":MASTER_KEY}, body:JSON.stringify(data) });
  if(!r.ok) throw new Error("PUT "+r.status);
  return r.json();
}

// ── Join ──────────────────────────────────────────────────────────────────
// Pre-fill from sessionStorage if already named
window.addEventListener("load",()=>{
  const saved = sessionStorage.getItem("visitorName");
  if(saved){ document.getElementById("nameInput").value = saved; }
  setTimeout(()=> document.getElementById("nameInput").focus(), 150);
});

async function joinChat(){
  const input = document.getElementById("nameInput");
  const name  = input.value.trim();
  if(!name){ input.classList.add("error"); setTimeout(()=> input.classList.remove("error"),500); return; }

  myName  = name;
  myColor = colorFor(name);
  myId    = name + "_" + Date.now();
  sessionStorage.setItem("visitorName", name);

  document.getElementById("nameGate").classList.remove("show");
  document.getElementById("msgInput").focus();

  // Mark online & load chat
  await markOnline();
  await loadMessages(true);
  startPolling();

  // Mark offline on tab close
  window.addEventListener("beforeunload", markOffline);
}

document.getElementById("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") joinChat(); });

// ── Online presence ───────────────────────────────────────────────────────
async function markOnline(){
  try{
    const data = await binGet(BIN_CHAT);
    data.online = data.online || {};
    data.online[myId] = { name:myName, color:myColor, ts: Date.now() };
    await binPut(BIN_CHAT, data);
  }catch(e){}
}

async function markOffline(){
  try{
    const data = await binGet(BIN_CHAT);
    if(data.online) delete data.online[myId];
    await binPut(BIN_CHAT, data);
  }catch(e){}
}

function renderOnline(onlineMap){
  const list  = document.getElementById("onlineList");
  const count = document.getElementById("onlineCount");
  const now   = Date.now();
  // Consider online if seen in last 30s
  const active = Object.values(onlineMap||{}).filter(u=> now - u.ts < 30000);
  count.textContent = active.length + " online";
  list.innerHTML = active.map(u=>`
    <div class="online-user">
      <div class="ou-avatar" style="background:${u.color}22;color:${u.color}">${u.name.slice(0,2).toUpperCase()}</div>
      <span class="ou-name">${u.name}${u.name===myName?'<span class="ou-you">(you)</span>':""}</span>
    </div>
  `).join("");
}

// ── Polling ───────────────────────────────────────────────────────────────
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async()=>{
    await markOnline(); // heartbeat
    await loadMessages(false);
  }, 3000);
}

// ── Load & render messages ────────────────────────────────────────────────
async function loadMessages(initial){
  try{
    const data = await binGet(BIN_CHAT);
    const msgs = data.messages || [];
    renderOnline(data.online || {});

    // Only re-render if something changed
    const latestId = msgs.length ? msgs[msgs.length-1].id : "";
    if(!initial && latestId === lastMsgId) return;
    lastMsgId = latestId;
    messages  = msgs;
    renderMessages();
  }catch(e){}
}

function renderMessages(){
  const box = document.getElementById("messages");
  const empty = document.getElementById("emptyChat");

  if(!messages.length){ empty.style.display="flex"; box.innerHTML=""; box.appendChild(empty); return; }
  empty.style.display="none";

  let lastDate = "";
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

  box.innerHTML = messages.map(m=>{
    const mine = m.name === myName;
    const color= colorFor(m.name);
    const date = new Date(m.ts).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});
    const time = new Date(m.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});

    let html = "";
    if(date !== lastDate){ lastDate=date; html+=`<div class="date-divider"><span>${date}</span></div>`; }

    if(m.type==="system"){
      html+=`<div class="sys-msg">${m.text}</div>`;
    } else {
      html+=`
        <div class="msg ${mine?"mine":""}">
          <div class="msg-avatar" style="background:${color}22;color:${color}">${m.name.slice(0,2).toUpperCase()}</div>
          <div class="msg-content">
            <div class="msg-meta">
              ${!mine?`<span class="msg-name">${m.name}</span>`:""}
              <span class="msg-time">${time}</span>
            </div>
            <div class="msg-bubble">${escHtml(m.text)}</div>
          </div>
        </div>`;
    }
    return html;
  }).join("");

  if(initial || atBottom) box.scrollTop = box.scrollHeight;
}

function escHtml(str){ return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }

// ── Send ──────────────────────────────────────────────────────────────────
async function sendMessage(){
  const input = document.getElementById("msgInput");
  const text  = input.value.trim();
  if(!text || !myName) return;

  input.value = "";
  input.style.height = "46px";
  document.getElementById("sendBtn").disabled = true;

  const msg = { id: Date.now()+"_"+Math.random().toString(36).slice(2), name:myName, text, ts:Date.now(), type:"chat" };

  try{
    const data = await binGet(BIN_CHAT);
    data.messages = data.messages || [];
    data.messages.push(msg);
    // Keep last 200 messages max
    if(data.messages.length > 200) data.messages = data.messages.slice(-200);
    // Clear typing
    if(data.typing) delete data.typing[myId];
    await binPut(BIN_CHAT, data);
    messages = data.messages;
    lastMsgId = messages[messages.length-1].id;
    renderMessages();
  }catch(e){}

  document.getElementById("sendBtn").disabled = false;
  input.focus();
}

function handleKey(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  // Auto-grow textarea
  const ta = e.target;
  ta.style.height="46px";
  ta.style.height = Math.min(ta.scrollHeight, 120)+"px";
}

// ── Typing indicator ──────────────────────────────────────────────────────
async function handleTyping(){
  // Auto-grow
  const ta = document.getElementById("msgInput");
  ta.style.height="46px";
  ta.style.height=Math.min(ta.scrollHeight,120)+"px";

  clearTimeout(typingTimer);
  typingTimer = setTimeout(clearTyping, 3000);
  // Don't spam — only update typing once every 2s
}

async function clearTyping(){
  try{
    const data = await binGet(BIN_CHAT);
    if(data.typing) delete data.typing[myId];
    await binPut(BIN_CHAT,data);
  }catch(e){}
}

// ── Admin: clear chat ─────────────────────────────────────────────────────
async function clearChat(){
  if(!confirm("Clear all messages? This cannot be undone.")) return;
  try{
    const data = await binGet(BIN_CHAT);
    data.messages = [{ id:"sys_"+Date.now(), name:"System", text:"Chat was cleared by an admin.", ts:Date.now(), type:"system" }];
    await binPut(BIN_CHAT,data);
    messages = data.messages;
    lastMsgId = messages[messages.length-1].id;
    renderMessages();
  }catch(e){ alert("Failed to clear chat."); }
}
</script>
</body>
</html>
