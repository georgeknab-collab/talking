<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Live Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2129;
    --surface3: #252830;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0;
    --text2: #9499a8;
    --text3: #5c6172;
    --accent: #6C63FF;
    --accent2: #8b85ff;
    --accent-dim: rgba(108,99,255,0.15);
    --green: #34d399;
    --green-dim: rgba(52,211,153,0.15);
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 12px;
    --radius-lg: 18px;
  }

  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ---- LANDING / NAME SCREEN ---- */
  #landing {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; flex-direction: column; gap: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(108,99,255,0.12) 0%, transparent 70%);
    animation: fadein 0.6s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .landing-card {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 48px 40px 40px;
    width: 380px;
    text-align: center;
  }
  .logo { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 600; letter-spacing: -1px; color: var(--text); margin-bottom: 6px; }
  .logo span { color: var(--accent2); }
  .tagline { font-size: 13px; color: var(--text3); margin-bottom: 36px; letter-spacing: 0.02em; }

  .room-tabs { display: flex; gap: 8px; margin-bottom: 28px; background: var(--surface2); border-radius: 10px; padding: 4px; }
  .room-tab {
    flex: 1; padding: 8px; font-size: 12px; font-weight: 500;
    background: transparent; border: none; border-radius: 7px;
    color: var(--text2); cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .room-tab.active { background: var(--surface3); color: var(--text); }

  .input-group { margin-bottom: 16px; text-align: left; }
  .input-group label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 6px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  .input-group input {
    width: 100%; padding: 12px 14px; background: var(--surface2);
    border: 0.5px solid var(--border2); border-radius: var(--radius);
    color: var(--text); font-size: 15px; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color: var(--text3); }

  .btn-primary {
    width: 100%; padding: 13px; background: var(--accent);
    border: none; border-radius: var(--radius); color: #fff;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: background 0.2s, transform 0.1s; margin-top: 8px;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:active { transform: scale(0.98); }

  .error-msg { font-size: 12px; color: var(--red); margin-top: 8px; min-height: 16px; }

  /* ---- MAIN CHAT LAYOUT ---- */
  #app {
    display: none; height: 100vh;
    grid-template-columns: 260px 1fr 220px;
    grid-template-rows: 1fr;
  }
  #app.visible { display: grid; animation: fadein 0.4s ease; }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface);
    border-right: 0.5px solid var(--border);
    display: flex; flex-direction: column;
    padding: 20px 0;
  }
  .sidebar-logo { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -0.5px; padding: 0 20px 20px; border-bottom: 0.5px solid var(--border); color: var(--text); }
  .sidebar-logo span { color: var(--accent2); }

  .sidebar-section { padding: 16px 20px 8px; font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

  .room-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px; font-size: 14px; color: var(--text2);
    cursor: pointer; transition: background 0.15s, color 0.15s;
    border-radius: 0;
  }
  .room-item:hover { background: var(--surface2); color: var(--text); }
  .room-item.active { background: var(--accent-dim); color: var(--accent2); }
  .room-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .room-item.active .room-dot { background: var(--accent2); }
  .room-count { margin-left: auto; font-size: 11px; background: var(--surface3); color: var(--text3); padding: 2px 7px; border-radius: 20px; }

  .sidebar-footer { margin-top: auto; padding: 16px 20px 0; border-top: 0.5px solid var(--border); }
  .me-card { display: flex; align-items: center; gap: 10px; }
  .me-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .me-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .me-status { font-size: 11px; color: var(--green); }
  .me-leave { margin-left: auto; font-size: 12px; color: var(--text3); cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.15s, color 0.15s; }
  .me-leave:hover { background: rgba(248,113,113,0.12); color: var(--red); }

  /* MAIN CHAT */
  .chat-area { display: flex; flex-direction: column; min-width: 0; }

  .chat-header {
    padding: 16px 24px; border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .chat-room-name { font-size: 16px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
  .chat-room-desc { font-size: 13px; color: var(--text3); margin-left: 4px; }
  .online-pill { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); background: var(--green-dim); padding: 4px 10px; border-radius: 20px; }
  .online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .messages-wrap { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; }
  .messages-wrap::-webkit-scrollbar { width: 4px; }
  .messages-wrap::-webkit-scrollbar-track { background: transparent; }
  .messages-wrap::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .msg-group { display: flex; gap: 10px; margin-top: 14px; }
  .msg-group.me { flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
  .msg-body { max-width: 65%; display: flex; flex-direction: column; gap: 3px; }
  .msg-meta { display: flex; align-items: baseline; gap: 8px; }
  .msg-group.me .msg-meta { flex-direction: row-reverse; }
  .msg-sender { font-size: 12px; font-weight: 600; }
  .msg-time { font-size: 11px; color: var(--text3); }
  .msg-bubble {
    padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5;
    background: var(--surface2); color: var(--text);
    word-break: break-word; width: fit-content;
  }
  .msg-group.me .msg-bubble { background: var(--accent); color: #fff; margin-left: auto; }
  .msg-group.me .msg-body { align-items: flex-end; }

  .system-msg { text-align: center; font-size: 12px; color: var(--text3); padding: 8px 0; }
  .system-msg span { background: var(--surface2); padding: 3px 12px; border-radius: 20px; }

  .typing-indicator { padding: 0 24px 10px; font-size: 12px; color: var(--text3); min-height: 24px; }
  .typing-dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--text3); margin: 0 1px; animation: bounce 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }

  .chat-input-area {
    padding: 16px 24px; border-top: 0.5px solid var(--border);
    display: flex; align-items: flex-end; gap: 10px;
  }
  .input-wrap { flex: 1; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius); display: flex; align-items: flex-end; }
  #msgInput {
    flex: 1; background: transparent; border: none; outline: none;
    padding: 12px 14px; color: var(--text); font-size: 14px; font-family: inherit;
    resize: none; max-height: 120px; line-height: 1.5;
  }
  #msgInput::placeholder { color: var(--text3); }
  .send-btn {
    margin: 8px; width: 36px; height: 36px; border-radius: 9px;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s; flex-shrink: 0; color: #fff;
  }
  .send-btn:hover { background: var(--accent2); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn svg { width: 16px; height: 16px; }

  /* MEMBERS PANEL */
  .members-panel { background: var(--surface); border-left: 0.5px solid var(--border); padding: 20px 0; overflow-y: auto; }
  .members-panel::-webkit-scrollbar { width: 4px; }
  .members-panel::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
  .members-heading { padding: 0 16px 12px; font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .member-item { display: flex; align-items: center; gap: 9px; padding: 8px 16px; }
  .member-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .member-name { font-size: 13px; color: var(--text2); }
  .member-name.you { color: var(--text); font-weight: 500; }
  .member-you-tag { font-size: 10px; color: var(--text3); background: var(--surface3); padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
  .member-online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-left: auto; }

  /* EMOJI REACTION — hover effect */
  .msg-bubble:hover { cursor: default; }

  /* Responsive tweaks */
  @media (max-width: 720px) {
    #app.visible { grid-template-columns: 1fr; }
    .sidebar, .members-panel { display: none; }
  }
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <div class="landing-card">
    <div class="logo">Pulse<span>.</span></div>
    <div class="tagline">Real-time chat — no account needed</div>

    <div class="room-tabs">
      <button class="room-tab active" onclick="selectRoom('General')">General</button>
      <button class="room-tab" onclick="selectRoom('Tech Talk')">Tech Talk</button>
      <button class="room-tab" onclick="selectRoom('Random')">Random</button>
    </div>

    <div class="input-group">
      <label>Your name</label>
      <input type="text" id="nameInput" placeholder="Enter a display name…" maxlength="24" autofocus>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-primary" onclick="joinChat()">Join Chat →</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">Pulse<span>.</span></div>
    <div class="sidebar-section">Rooms</div>
    <div class="room-item active" id="room-General" onclick="switchRoom('General')">
      <div class="room-dot"></div> General
      <span class="room-count" id="count-General">0</span>
    </div>
    <div class="room-item" id="room-Tech Talk" onclick="switchRoom('Tech Talk')">
      <div class="room-dot"></div> Tech Talk
      <span class="room-count" id="count-Tech Talk">0</span>
    </div>
    <div class="room-item" id="room-Random" onclick="switchRoom('Random')">
      <div class="room-dot"></div> Random
      <span class="room-count" id="count-Random">0</span>
    </div>
    <div class="sidebar-footer">
      <div class="me-card" id="meCard">
        <div class="me-avatar" id="meAvatar"></div>
        <div>
          <div class="me-name" id="meNameDisplay"></div>
          <div class="me-status">● Online</div>
        </div>
        <div class="me-leave" onclick="leaveChat()" title="Leave chat">✕</div>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area">
    <div class="chat-header">
      <div>
        <span class="chat-room-name" id="chatRoomName"># General</span>
      </div>
      <div class="online-pill"><div class="online-dot"></div><span id="onlineCount">1 online</span></div>
    </div>
    <div class="messages-wrap" id="messages"></div>
    <div class="typing-indicator" id="typingIndicator"></div>
    <div class="chat-input-area">
      <div class="input-wrap">
        <textarea id="msgInput" rows="1" placeholder="Message…" maxlength="1000"></textarea>
      </div>
      <button class="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- Members -->
  <div class="members-panel">
    <div class="members-heading">Members</div>
    <div id="membersList"></div>
  </div>
</div>

<script>
// ---- STATE ----
const ROOMS = ['General', 'Tech Talk', 'Random'];
const ROOM_DESCS = { 'General': 'General chat', 'Tech Talk': 'Code & tech', 'Random': 'Off-topic fun' };
const COLORS = ['#6C63FF','#34d399','#f59e0b','#f87171','#60a5fa','#a78bfa','#fb7185','#2dd4bf'];

let myName = '';
let myColor = '';
let myId = '';
let currentRoom = 'General';
let selectedRoomOnLanding = 'General';
let members = {}; // { id: { name, color, room } }
let typingTimers = {};
let typingUsers = {};
let myTypingTimer = null;
let lastSenderId = null;
let lastSenderTime = 0;

// ---- BROADCAST CHANNEL (cross-tab) ----
const channels = {};
ROOMS.forEach(r => {
  channels[r] = new BroadcastChannel('pulse_' + r);
  channels[r].onmessage = (e) => handleMessage(e.data, r);
});
const presenceChannel = new BroadcastChannel('pulse_presence');
presenceChannel.onmessage = (e) => handlePresence(e.data);

// ---- UTILS ----
function genId() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function getInitials(name) { return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function pickColor(id) { return COLORS[parseInt(id.slice(-2),36) % COLORS.length]; }

function avatar(name, color, size=32) {
  return `<div class="msg-avatar" style="background:${color}22;color:${color};width:${size}px;height:${size}px;">${getInitials(name)}</div>`;
}

// ---- LANDING ----
function selectRoom(r) {
  selectedRoomOnLanding = r;
  document.querySelectorAll('.room-tab').forEach((t,i)=>{ t.classList.toggle('active', ROOMS[i]===r); });
}

document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') joinChat(); });

function joinChat() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('errorMsg').textContent = 'Please enter a display name.'; return; }
  if (name.length < 2) { document.getElementById('errorMsg').textContent = 'Name must be at least 2 characters.'; return; }

  myName = name;
  myId = genId();
  myColor = pickColor(myId);
  currentRoom = selectedRoomOnLanding;

  document.getElementById('meAvatar').style.cssText = `background:${myColor}22;color:${myColor}`;
  document.getElementById('meAvatar').textContent = getInitials(myName);
  document.getElementById('meNameDisplay').textContent = myName;

  document.getElementById('landing').style.display = 'none';
  document.getElementById('app').classList.add('visible');

  // Register self
  members[myId] = { name: myName, color: myColor, room: currentRoom };

  // Announce join
  presenceChannel.postMessage({ type:'join', id:myId, name:myName, color:myColor, room:currentRoom });

  // Ask others to announce themselves
  presenceChannel.postMessage({ type:'who', from:myId });

  switchRoom(currentRoom, true);
  document.getElementById('msgInput').focus();
  updateRoomCounts();

  // Cleanup on close
  window.addEventListener('beforeunload', () => {
    presenceChannel.postMessage({ type:'leave', id:myId, room:currentRoom });
  });
}

// ---- ROOM SWITCH ----
function switchRoom(room, initial=false) {
  if (!initial) {
    presenceChannel.postMessage({ type:'room', id:myId, from:currentRoom, to:room });
    addSystemMsg(`You left #${currentRoom}`, currentRoom);
  }

  currentRoom = room;
  members[myId].room = room;

  document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('room-'+room);
  if(el) el.classList.add('active');

  document.getElementById('chatRoomName').textContent = '# ' + room;
  document.getElementById('messages').innerHTML = '';
  lastSenderId = null;

  if(!initial) {
    presenceChannel.postMessage({ type:'join_room', id:myId, room });
    addSystemMsg(`You joined #${room}`, room);
  } else {
    addSystemMsg(`Welcome to #${room}! 👋`, room);
  }

  updateMembersList();
  updateOnlineCount();
  typingUsers = {};
  renderTyping();
}

// ---- PRESENCE ----
function handlePresence(data) {
  if (data.type === 'join') {
    members[data.id] = { name: data.name, color: data.color, room: data.room };
    if (data.id !== myId && data.room === currentRoom) {
      addSystemMsg(`${data.name} joined the chat`, currentRoom);
    }
    updateAll();
    // Reply with my info
    if (data.id !== myId) {
      presenceChannel.postMessage({ type:'here', id:myId, name:myName, color:myColor, room:currentRoom });
    }
  } else if (data.type === 'here') {
    members[data.id] = { name: data.name, color: data.color, room: data.room };
    updateAll();
  } else if (data.type === 'who') {
    if (data.from !== myId) {
      presenceChannel.postMessage({ type:'here', id:myId, name:myName, color:myColor, room:currentRoom });
    }
  } else if (data.type === 'leave') {
    const m = members[data.id];
    if (m && data.id !== myId && m.room === currentRoom) {
      addSystemMsg(`${m.name} left the chat`, currentRoom);
    }
    delete members[data.id];
    updateAll();
  } else if (data.type === 'room') {
    if (members[data.id]) {
      if (data.id !== myId && members[data.id].room === currentRoom) {
        addSystemMsg(`${members[data.id].name} left #${data.from}`, data.from);
      }
      members[data.id].room = data.to;
      if (data.id !== myId && data.to === currentRoom) {
        addSystemMsg(`${members[data.id].name} joined #${data.to}`, data.to);
      }
      updateAll();
    }
  } else if (data.type === 'join_room') {
    if (members[data.id]) {
      members[data.id].room = data.room;
      updateAll();
    }
  } else if (data.type === 'typing_start') {
    if (data.id !== myId && data.room === currentRoom) {
      typingUsers[data.id] = data.name;
      clearTimeout(typingTimers[data.id]);
      typingTimers[data.id] = setTimeout(() => { delete typingUsers[data.id]; renderTyping(); }, 3000);
      renderTyping();
    }
  } else if (data.type === 'typing_stop') {
    delete typingUsers[data.id];
    clearTimeout(typingTimers[data.id]);
    renderTyping();
  }
}

// ---- MESSAGES ----
function handleMessage(data, room) {
  if (room !== currentRoom) return;
  if (data.senderId === myId) return;
  appendMessage(data, false);
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoResize(input);

  stopTyping();

  const data = {
    senderId: myId, senderName: myName, senderColor: myColor,
    text, ts: Date.now(), room: currentRoom
  };
  channels[currentRoom].postMessage(data);
  appendMessage(data, true);
}

function appendMessage(data, isMe) {
  const wrap = document.getElementById('messages');
  const now = Date.now();
  const sameUser = data.senderId === lastSenderId && (data.ts - lastSenderTime) < 60000;

  if (!sameUser) {
    const group = document.createElement('div');
    group.className = 'msg-group' + (isMe ? ' me' : '');

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.style.cssText = `background:${data.senderColor}22;color:${data.senderColor};width:32px;height:32px;margin-top:2px;`;
    av.textContent = getInitials(data.senderName);

    const body = document.createElement('div');
    body.className = 'msg-body';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = `<span class="msg-sender" style="color:${data.senderColor}">${escHtml(data.senderName)}</span><span class="msg-time">${formatTime(data.ts)}</span>`;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = data.text;

    body.appendChild(meta);
    body.appendChild(bubble);
    group.appendChild(av);
    group.appendChild(body);
    wrap.appendChild(group);
  } else {
    // Append bubble to last group
    const groups = wrap.querySelectorAll('.msg-group');
    const lastGroup = groups[groups.length-1];
    if (lastGroup) {
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = data.text;
      lastGroup.querySelector('.msg-body').appendChild(bubble);
    }
  }

  lastSenderId = data.senderId;
  lastSenderTime = data.ts;
  wrap.scrollTop = wrap.scrollHeight;
}

function addSystemMsg(text, room) {
  if (room !== currentRoom) return;
  const wrap = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'system-msg';
  el.innerHTML = `<span>${escHtml(text)}</span>`;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  lastSenderId = null;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- TYPING ----
document.getElementById('msgInput').addEventListener('input', function() {
  autoResize(this);
  if (this.value.trim()) {
    presenceChannel.postMessage({ type:'typing_start', id:myId, name:myName, room:currentRoom });
    clearTimeout(myTypingTimer);
    myTypingTimer = setTimeout(stopTyping, 2500);
  } else {
    stopTyping();
  }
});
document.getElementById('msgInput').addEventListener('keydown', function(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function stopTyping() {
  clearTimeout(myTypingTimer);
  presenceChannel.postMessage({ type:'typing_stop', id:myId, room:currentRoom });
}

function renderTyping() {
  const names = Object.values(typingUsers);
  const el = document.getElementById('typingIndicator');
  if (!names.length) { el.innerHTML=''; return; }
  const who = names.length===1 ? names[0] : names.length===2 ? names.join(' & ') : 'Several people';
  el.innerHTML = `<span style="color:var(--text2)">${escHtml(who)} is typing</span> <span class="typing-dots"><span></span><span></span><span></span></span>`;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ---- MEMBERS / COUNTS ----
function updateAll() { updateMembersList(); updateOnlineCount(); updateRoomCounts(); }

function updateMembersList() {
  const list = document.getElementById('membersList');
  const inRoom = Object.entries(members).filter(([,m])=>m.room===currentRoom);
  list.innerHTML = inRoom.map(([id,m]) => {
    const isMe = id === myId;
    return `<div class="member-item">
      <div class="member-avatar" style="background:${m.color}22;color:${m.color}">${getInitials(m.name)}</div>
      <span class="member-name${isMe?' you':''}">${escHtml(m.name)}${isMe?'<span class="member-you-tag">you</span>':''}</span>
      <div class="member-online-dot"></div>
    </div>`;
  }).join('');
}

function updateOnlineCount() {
  const n = Object.values(members).filter(m=>m.room===currentRoom).length;
  document.getElementById('onlineCount').textContent = n + ' online';
}

function updateRoomCounts() {
  ROOMS.forEach(r => {
    const n = Object.values(members).filter(m=>m.room===r).length;
    const el = document.getElementById('count-'+r);
    if(el) el.textContent = n;
  });
}

// ---- LEAVE ----
function leaveChat() {
  presenceChannel.postMessage({ type:'leave', id:myId, room:currentRoom });
  delete members[myId];
  document.getElementById('app').classList.remove('visible');
  document.getElementById('landing').style.display = 'flex';
  document.getElementById('nameInput').value = '';
  document.getElementById('errorMsg').textContent = '';
  lastSenderId = null;
}
</script>
</body>
</html>
