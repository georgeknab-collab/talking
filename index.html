<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Hub — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8271e;
  --red-dim:rgba(232,39,30,0.15);
  --red-glow:rgba(232,39,30,0.35);
  --bg:#08080a;
  --surface:#0f0f14;
  --surface2:#14141c;
  --surface3:#1a1a26;
  --border:rgba(255,255,255,0.06);
  --border-red:rgba(232,39,30,0.25);
  --text:#f0ecf8;
  --muted:#4a4a6a;
  --muted2:#2e2e45;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'Syne',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* Ambient background */
body::before{
  content:'';
  position:fixed;
  top:-200px; left:-200px;
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(232,39,30,0.06) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  bottom:-200px; right:-200px;
  width:500px; height:500px;
  background:radial-gradient(circle, rgba(100,60,232,0.04) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

/* ── NAME GATE ── */
.gate-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(4,4,8,0.92);
  backdrop-filter:blur(20px);
  z-index:9999;
  justify-content:center;
  align-items:center;
}
.gate-overlay.show{ display:flex; }

.gate-card{
  background:var(--surface);
  border:1px solid var(--border-red);
  border-radius:24px;
  padding:52px 44px;
  width:420px;
  text-align:center;
  box-shadow:0 0 80px rgba(232,39,30,0.12), 0 40px 80px rgba(0,0,0,0.6);
  animation:gateIn 0.5s cubic-bezier(0.22,1,0.36,1);
  position:relative;
  overflow:hidden;
}

.gate-card::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--red), transparent);
}

@keyframes gateIn{
  from{ transform:translateY(30px) scale(0.95); opacity:0; }
  to{ transform:translateY(0) scale(1); opacity:1; }
}

.gate-eyebrow{
  font-size:11px;
  font-weight:700;
  letter-spacing:4px;
  color:var(--red);
  margin-bottom:16px;
  text-transform:uppercase;
}

.gate-card h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:48px;
  letter-spacing:3px;
  line-height:1;
  margin-bottom:10px;
}

.gate-card p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:32px;
  line-height:1.6;
}

.gate-input{
  width:100%;
  padding:16px 20px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  font-size:15px;
  font-family:'Syne',sans-serif;
  font-weight:500;
  outline:none;
  text-align:center;
  transition:border 0.2s, box-shadow 0.2s;
  margin-bottom:14px;
  letter-spacing:0.5px;
}
.gate-input:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(232,39,30,0.1);
}
.gate-input.shake{ animation:shake 0.4s; border-color:var(--red); }

.gate-btn{
  width:100%;
  padding:16px;
  background:var(--red);
  border:none;
  border-radius:14px;
  color:white;
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  letter-spacing:3px;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 0 30px var(--red-glow);
  position:relative;
  overflow:hidden;
}
.gate-btn::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
}
.gate-btn:hover{ transform:translateY(-2px); box-shadow:0 0 40px var(--red-glow), 0 8px 30px rgba(0,0,0,0.4); }
.gate-btn:active{ transform:translateY(0); }

/* ── NAVBAR ── */
nav{
  position:relative;
  z-index:100;
  height:64px;
  background:rgba(8,8,10,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 28px;
  flex-shrink:0;
}

.nav-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;
  letter-spacing:5px;
  color:var(--red);
  text-decoration:none;
  text-shadow:0 0 20px var(--red-glow);
}
.nav-logo span{ color:var(--text); }

.nav-links{
  display:flex;
  gap:6px;
  align-items:center;
}
.nav-links a{
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.5px;
  padding:7px 14px;
  border-radius:8px;
  transition:0.2s;
}
.nav-links a:hover{ color:var(--text); background:var(--surface2); }
.nav-links a.active{ color:var(--text); background:var(--surface2); }

.online-badge{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:7px 16px;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:0.3px;
}
.online-dot{
  width:7px; height:7px;
  border-radius:50%;
  background:#22d3a0;
  box-shadow:0 0 6px #22d3a0;
  animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.5; transform:scale(0.85); } }

/* ── MAIN LAYOUT ── */
.chat-wrap{
  flex:1;
  display:flex;
  overflow:hidden;
  position:relative;
  z-index:1;
}

/* ── SIDEBAR ── */
.sidebar{
  width:220px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}

.sidebar-top{
  padding:20px 18px 14px;
  border-bottom:1px solid var(--border);
}

.sidebar-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--muted);
  text-transform:uppercase;
}

.online-list{
  flex:1;
  overflow-y:auto;
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.online-list::-webkit-scrollbar{ width:3px; }
.online-list::-webkit-scrollbar-thumb{ background:var(--muted2); border-radius:2px; }

.ou-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border-radius:10px;
  transition:background 0.15s;
  cursor:default;
}
.ou-row:hover{ background:var(--surface2); }

.ou-av{
  width:30px; height:30px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px;
  font-weight:800;
  flex-shrink:0;
  letter-spacing:0.5px;
}
.ou-info{ flex:1; min-width:0; }
.ou-name{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ou-tag{
  font-size:10px;
  color:var(--muted);
  margin-top:1px;
}

/* ── CHAT MAIN ── */
.chat-main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}

/* Header */
.chat-header{
  padding:16px 28px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:14px;
  flex-shrink:0;
  background:var(--surface);
}

.ch-icon-wrap{
  width:40px; height:40px;
  background:var(--red-dim);
  border:1px solid var(--border-red);
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
  flex-shrink:0;
}

.ch-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  letter-spacing:2px;
  line-height:1;
}
.ch-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  font-weight:600;
  letter-spacing:0.3px;
}

.header-actions{ margin-left:auto; display:flex; gap:8px; }

.clear-btn{
  display:none;
  padding:8px 16px;
  background:none;
  border:1px solid var(--border-red);
  border-radius:8px;
  color:var(--red);
  font-size:12px;
  font-weight:700;
  font-family:'Syne',sans-serif;
  cursor:pointer;
  letter-spacing:0.5px;
  transition:0.2s;
}
.clear-btn:hover{ background:var(--red); color:white; }
body.admin-mode .clear-btn{ display:block; }

/* Messages */
.messages{
  flex:1;
  overflow-y:auto;
  padding:24px 28px;
  display:flex;
  flex-direction:column;
  gap:4px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{ width:4px; }
.messages::-webkit-scrollbar-thumb{ background:var(--muted2); border-radius:2px; }

/* Empty */
.empty-chat{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  color:var(--muted2);
}
.empty-icon{
  font-size:56px;
  filter:grayscale(0.3);
}
.empty-chat h3{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  letter-spacing:2px;
  color:var(--muted);
}
.empty-chat p{ font-size:13px; color:var(--muted); }

/* Date divider */
.date-div{
  display:flex;
  align-items:center;
  gap:14px;
  margin:16px 0 8px;
}
.date-div::before,.date-div::after{ content:''; flex:1; height:1px; background:var(--border); }
.date-div span{
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
  white-space:nowrap;
}

/* System */
.sys-msg{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  padding:6px 0;
  font-style:italic;
}

/* Message group */
.msg-group{ display:flex; flex-direction:column; margin-bottom:2px; }
.msg-group.mine{ align-items:flex-end; }
.msg-group.other{ align-items:flex-start; }

.msg-row{ display:flex; align-items:flex-end; gap:10px; max-width:68%; }
.msg-group.mine .msg-row{ flex-direction:row-reverse; }

.msg-av{
  width:32px; height:32px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800;
  flex-shrink:0;
  letter-spacing:0.5px;
}
/* Only show avatar on first message of group */
.msg-av.hidden{ visibility:hidden; }

.msg-body{ display:flex; flex-direction:column; gap:3px; }
.msg-group.mine .msg-body{ align-items:flex-end; }

.msg-sender{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.5px;
  margin-bottom:2px;
  padding:0 4px;
}

.bubble{
  padding:10px 16px;
  border-radius:18px;
  font-size:14px;
  line-height:1.55;
  word-break:break-word;
  max-width:100%;
  animation:bubbleIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes bubbleIn{
  from{ transform:scale(0.88) translateY(4px); opacity:0; }
  to{ transform:scale(1) translateY(0); opacity:1; }
}
.msg-group.other .bubble{
  background:var(--surface2);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
  color:var(--text);
}
.msg-group.mine .bubble{
  background:var(--red);
  border-bottom-right-radius:4px;
  color:white;
}

.msg-time{
  font-size:10px;
  color:var(--muted);
  padding:0 4px;
  margin-top:2px;
}
.msg-group.mine .msg-time{ color:rgba(255,255,255,0.35); }

/* ── INPUT BAR ── */
.input-bar{
  padding:16px 28px;
  border-top:1px solid var(--border);
  display:flex;
  gap:12px;
  align-items:flex-end;
  background:var(--surface);
  flex-shrink:0;
}

.input-wrap{
  flex:1;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:16px;
  display:flex;
  align-items:flex-end;
  gap:0;
  transition:border 0.2s, box-shadow 0.2s;
  overflow:hidden;
}
.input-wrap:focus-within{
  border-color:rgba(232,39,30,0.4);
  box-shadow:0 0 0 3px rgba(232,39,30,0.07);
}

.msg-input{
  flex:1;
  background:none;
  border:none;
  padding:13px 18px;
  color:var(--text);
  font-size:14px;
  font-family:'Syne',sans-serif;
  font-weight:500;
  outline:none;
  resize:none;
  height:48px;
  max-height:130px;
  line-height:1.5;
  overflow-y:auto;
}
.msg-input::placeholder{ color:var(--muted); }

.send-btn{
  width:48px; height:48px;
  background:var(--red);
  border:none;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:0.2s;
  box-shadow:0 0 20px var(--red-glow);
  margin:0;
}
.send-btn:hover{ background:#f03028; transform:scale(1.05); }
.send-btn:active{ transform:scale(0.97); }
.send-btn:disabled{ opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none; }
.send-btn svg{ width:18px; height:18px; fill:white; margin-left:2px; }

/* Typing */
.typing-bar{
  height:22px;
  padding:0 28px;
  font-size:11px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
  font-style:italic;
  flex-shrink:0;
}
.typing-dots{ display:flex; gap:3px; }
.typing-dots span{
  width:4px; height:4px;
  border-radius:50%;
  background:var(--muted);
  animation:tdot 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2){ animation-delay:0.2s; }
.typing-dots span:nth-child(3){ animation-delay:0.4s; }
@keyframes tdot{ 0%,100%{ transform:translateY(0); opacity:0.4; } 50%{ transform:translateY(-3px); opacity:1; } }

@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(8px); }
  60%{ transform:translateX(-5px); }
  80%{ transform:translateX(5px); }
}
</style>
</head>
<body>

<!-- ── NAME GATE ── -->
<div class="gate-overlay show" id="nameGate">
  <div class="gate-card">
    <div class="gate-eyebrow">🎬 Movie Hub</div>
    <h2>JOIN THE CHAT</h2>
    <p>Enter your name to jump into the conversation with everyone watching.</p>
    <input class="gate-input" id="nameInput" type="text" placeholder="Your name…" maxlength="30" autocomplete="off">
    <button class="gate-btn" onclick="joinChat()">ENTER CHAT</button>
  </div>
</div>

<!-- ── NAVBAR ── -->
<nav>
  <a href="inde x.html" class="nav-logo">MOV<span>IE</span> HUB</a>
  <div class="nav-links">
    <a href="inde x.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="chat.html" class="active">Chat</a>
    <a href="chatbot.html">Vault AI</a>
  </div>
  <div class="online-badge">
    <div class="online-dot"></div>
    <span id="onlineCount">0 online</span>
  </div>
</nav>

<!-- ── CHAT ── -->
<div class="chat-wrap">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">Online Now</div>
    </div>
    <div class="online-list" id="onlineList">
      <div style="padding:16px 10px;font-size:12px;color:var(--muted)">Join to see who's here</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="chat-main">

    <div class="chat-header">
      <div class="ch-icon-wrap">🎬</div>
      <div>
        <div class="ch-title">MOVIE HUB CHAT</div>
        <div class="ch-sub">REAL-TIME · ALL VISITORS</div>
      </div>
      <div class="header-actions">
        <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-chat" id="emptyChat">
        <div class="empty-icon">🍿</div>
        <h3>LIGHTS, CAMERA…</h3>
        <p>Be the first to say something!</p>
      </div>
    </div>

    <div class="typing-bar" id="typingBar"></div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea class="msg-input" id="msgInput" placeholder="Say something…" rows="1"
          onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>

  </main>
</div>

<script>
const MASTER_KEY = "$2a$10$EnLaOf3SjY6dKeq47M8uYeZK5N8f9xTYzPfbsR3fMNyiRZHY9Uqne";
const BIN_CHAT   = "6a260fc5f5f4af5e29c8873c";
const BASE       = "https://api.jsonbin.io/v3/b";

const COLORS = ["#e8271e","#f97316","#eab308","#22d3a0","#3b82f6","#a78bfa","#ec4899","#06b6d4","#84cc16","#f43f5e"];
function colorFor(n){ let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[Math.abs(h)]; }
function initials(n){ return n.trim().split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }

let myName="", myId="", myColor="";
let messages=[], lastId="", pollTimer=null, sending=false, polling=false;
let isAdmin = sessionStorage.getItem("vaultAdmin")==="true";
if(isAdmin) document.body.classList.add("admin-mode");

// ── API ───────────────────────────────────────────────────────────────────
async function binGet(){
  const r = await fetch(`${BASE}/${BIN_CHAT}/latest`,{
    headers:{"X-Master-Key":MASTER_KEY}
  });
  if(!r.ok){ const t=await r.text(); throw new Error(`GET ${r.status}: ${t}`); }
  const j = await r.json();
  return j.record !== undefined ? j.record : j;
}

async function binPut(data){
  const r = await fetch(`${BASE}/${BIN_CHAT}`,{
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Master-Key":MASTER_KEY},
    body:JSON.stringify(data)
  });
  if(!r.ok){ const t=await r.text(); throw new Error(`PUT ${r.status}: ${t}`); }
}

// ── Status bar ────────────────────────────────────────────────────────────
function setStatus(msg, color){
  const bar = document.getElementById("typingBar");
  if(!bar) return;
  bar.innerHTML = msg ? `<span style="color:${color||"var(--muted)"}">${msg}</span>` : "";
}

// ── Boot ──────────────────────────────────────────────────────────────────
window.addEventListener("load",()=>{
  const saved = sessionStorage.getItem("visitorName");
  if(saved) document.getElementById("nameInput").value = saved;
  setTimeout(()=> document.getElementById("nameInput").focus(), 200);
});

document.getElementById("nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") joinChat(); });

// ── Join ──────────────────────────────────────────────────────────────────
async function joinChat(){
  const input = document.getElementById("nameInput");
  const name  = input.value.trim();
  if(!name){ input.classList.add("shake"); setTimeout(()=>input.classList.remove("shake"),400); return; }

  myName  = name;
  myColor = colorFor(name);
  myId    = name+"_"+Date.now();
  sessionStorage.setItem("visitorName", name);

  document.getElementById("nameGate").classList.remove("show");
  document.getElementById("msgInput").focus();
  setStatus("Connecting…","var(--muted)");

  // Initial load
  try{
    const d = await binGet();
    // Mark self online
    d.online = d.online||{};
    d.online[myId] = { name:myName, color:myColor, ts:Date.now() };
    await binPut(d);
    renderOnline(d.online);
    messages = d.messages||[];
    lastId   = messages.length ? messages[messages.length-1].id : "";
    renderMessages(true);
    setStatus("");
  }catch(e){
    setStatus("\u26a0 Could not connect — "+e.message,"#e8271e");
  }

  startPolling();
  window.addEventListener("beforeunload", markOffline);
}

// ── Presence ──────────────────────────────────────────────────────────────
async function markOnline(){
  const d = await binGet();
  d.online = d.online||{};
  d.online[myId] = { name:myName, color:myColor, ts:Date.now() };
  await binPut(d);
}

function markOffline(){
  try{
    const xhr = new XMLHttpRequest();
    xhr.open("GET", `${BASE}/${BIN_CHAT}/latest`, false);
    xhr.setRequestHeader("X-Master-Key", MASTER_KEY);
    xhr.send();
    const d = JSON.parse(xhr.responseText);
    const rec = d.record !== undefined ? d.record : d;
    if(rec.online) delete rec.online[myId];
    const xhr2 = new XMLHttpRequest();
    xhr2.open("PUT", `${BASE}/${BIN_CHAT}`, false);
    xhr2.setRequestHeader("Content-Type","application/json");
    xhr2.setRequestHeader("X-Master-Key", MASTER_KEY);
    xhr2.send(JSON.stringify(rec));
  }catch(e){}
}

function renderOnline(map){
  const now    = Date.now();
  const active = Object.values(map||{}).filter(u=> now-u.ts < 30000);
  document.getElementById("onlineCount").textContent = active.length+" online";
  document.getElementById("onlineList").innerHTML = active.length
    ? active.map(u=>`
        <div class="ou-row">
          <div class="ou-av" style="background:${u.color}20;color:${u.color}">${initials(u.name)}</div>
          <div class="ou-info">
            <div class="ou-name">${esc(u.name)}</div>
            ${u.name===myName?'<div class="ou-tag">You</div>':""}
          </div>
        </div>`).join("")
    : `<div style="padding:16px 10px;font-size:12px;color:var(--muted)">Just you so far</div>`;
}

// ── Polling ───────────────────────────────────────────────────────────────
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async()=>{
    if(polling || sending) return;
    polling = true;
    try{
      const d = await binGet();
      // Update heartbeat
      d.online = d.online||{};
      d.online[myId] = { name:myName, color:myColor, ts:Date.now() };
      await binPut(d);
      renderOnline(d.online);
      // Sync messages
      const msgs = d.messages||[];
      const lid  = msgs.length ? msgs[msgs.length-1].id : "";
      if(lid !== lastId){
        lastId   = lid;
        messages = msgs;
        renderMessages(false);
      }
      setStatus("");
    }catch(e){ setStatus("\u26a0 Connection issue — retrying…","#f97316"); }
    finally{ polling = false; }
  }, 5000);
}

// ── Render ────────────────────────────────────────────────────────────────
function renderMessages(initial){
  const box = document.getElementById("messages");
  if(!box) return;

  if(!messages.length){
    box.innerHTML=`
      <div class="empty-chat">
        <div class="empty-icon">🍿</div>
        <h3>LIGHTS, CAMERA…</h3>
        <p>Be the first to say something!</p>
      </div>`;
    setStatus("");
    return;
  }

  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
  let html="", lastDate="", lastSender="";

  messages.forEach(m=>{
    const mine  = m.name===myName;
    const color = colorFor(m.name);
    const d     = new Date(m.ts);
    const date  = d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});
    const time  = d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});

    if(date!==lastDate){
      lastDate=date; lastSender="";
      html+=`<div class="date-div"><span>${date}</span></div>`;
    }

    if(m.type==="system"){
      html+=`<div class="sys-msg">${esc(m.text)}</div>`;
      lastSender=""; return;
    }

    const newSender = m.name!==lastSender;
    lastSender=m.name;

    html+=`
      <div class="msg-group ${mine?"mine":"other"}">
        <div class="msg-row">
          <div class="msg-av ${newSender?"":"hidden"}" style="background:${color}20;color:${color}">${initials(m.name)}</div>
          <div class="msg-body">
            ${newSender&&!mine?`<div class="msg-sender" style="color:${color}">${esc(m.name)}</div>`:""}
            <div class="bubble">${esc(m.text)}</div>
            <div class="msg-time">${time}</div>
          </div>
        </div>
      </div>`;
  });

  box.innerHTML=html;
  if(initial||atBottom) box.scrollTop=box.scrollHeight;
  setStatus("");
}

// ── Send ──────────────────────────────────────────────────────────────────
async function sendMessage(){
  if(sending) return;
  const ta   = document.getElementById("msgInput");
  const text = ta.value.trim();
  if(!text||!myName) return;

  ta.value=""; ta.style.height="48px";
  sending=true;
  document.getElementById("sendBtn").disabled=true;

  const msg = {
    id:   Date.now()+"_"+Math.random().toString(36).slice(2,7),
    name: myName,
    text,
    ts:   Date.now(),
    type: "chat"
  };

  // Show instantly (optimistic)
  messages.push(msg);
  lastId = msg.id;
  renderMessages(false);
  document.getElementById("messages").scrollTop=999999;

  // Save to JSONBin with retries
  let saved=false;
  for(let i=0; i<3; i++){
    try{
      const d = await binGet();
      d.messages = d.messages||[];
      if(!d.messages.find(x=>x.id===msg.id)){
        d.messages.push(msg);
        if(d.messages.length>200) d.messages=d.messages.slice(-200);
      }
      d.online = d.online||{};
      d.online[myId] = { name:myName, color:myColor, ts:Date.now() };
      await binPut(d);
      messages = d.messages;
      lastId   = messages[messages.length-1].id;
      renderMessages(false);
      document.getElementById("messages").scrollTop=999999;
      setStatus("");
      saved=true;
      break;
    }catch(e){
      if(i<2) await new Promise(r=>setTimeout(r,700));
    }
  }
  if(!saved) setStatus("\u26a0 Message may not have saved","#e8271e");

  sending=false;
  document.getElementById("sendBtn").disabled=false;
  ta.focus();
}

function handleKey(e){
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMessage(); }
  autoGrow(e.target);
}

function autoGrow(ta){
  ta.style.height="48px";
  ta.style.height=Math.min(ta.scrollHeight,130)+"px";
}

// ── Admin clear ───────────────────────────────────────────────────────────
async function clearChat(){
  if(!confirm("Delete all messages? This cannot be undone.")) return;
  try{
    const d = await binGet();
    d.messages=[{ id:"sys_"+Date.now(), name:"System", text:"Chat was cleared by an admin.", ts:Date.now(), type:"system" }];
    await binPut(d);
    messages=d.messages; lastId=messages[0].id;
    renderMessages(true);
  }catch(e){ setStatus("\u26a0 Failed to clear: "+e.message,"#e8271e"); }
}
</script>
